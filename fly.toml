# fly.toml app configuration file generated for robo-chefe-discord-cap2ig on 2026-05-08T01:02:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'robo-chefe-discord-cap2ig'
primary_region = 'ams'

[build]

[processes]
  app = 'python main.py'

[http_service]
  internal_port = 8080
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
