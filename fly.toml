app = "robo-chefe-discord"
primary_region = "gru"

[build]

[processes]
  app = "python main.py"

[http_service]
  internal_port = 8000
  force_https = false
  processes = ["app"]
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/"
